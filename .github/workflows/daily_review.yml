name: 每日檢討

on:
  schedule:
    - cron: "0 23 * * 0-4"   # UTC 週日~週四 23:00 = 台灣時間週一~週五 07:00 (台股開盤前)
  workflow_dispatch:          # 也可在 GitHub 的 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: daily-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 驗證、校準、預測、產生檢討報告
        run: python daily_review.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 存回 GitHub (Streamlit 會自動重新部署並讀到新權重)
        run: |
          git config user.name "daily-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "每日檢討 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase
            git push
          fi
