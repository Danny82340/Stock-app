name: 程式檢查

on:
  push:
    paths: ["**.py", "requirements.txt", ".github/workflows/check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 語法檢查
        run: python -m py_compile app.py stock_model.py daily_review.py
      - name: 模型實際執行 (2 檔股票，不寫檔)
        run: python daily_review.py --smoke
      - name: Streamlit 畫面測試 (選取台積電，檢查有沒有錯誤)
        run: python .github/app_test.py
